[package]
name = "pact-server"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
# El crate tiene dos binarios: el servidor y el seed de demo. Sin esto,
# `cargo run -p pact-server` deja de saber cuál arrancar y fallan `make dev` y
# `make run-server`.
default-run = "pact-server"

[dependencies]
pact-core = { path = "../pact-core" }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tower-http = { workspace = true }
blake2 = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
rand = { workspace = true }
hex = "0.4.3"
zip = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
zeroize = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
totp-rs = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# `multipart` solo se necesita en los tests (subir un .pcty), no en el binario.
reqwest = { workspace = true, features = ["multipart"] }
