[package]
name = "pact-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
# El wasm-opt que trae wasm-pack no reconoce las operaciones `bulk memory` que
# emite el std de Rust actual. El propio LLVM ya optimiza la salida, así que
# desactivamos el post-proceso de binaryen en vez de fijar una versión antigua.
wasm-opt = false

[dependencies]
argon2 = { workspace = true }
aes-gcm = { workspace = true }
blake2 = { workspace = true }
wasm-bindgen = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
getrandom = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
hex = "0.4.3"

[dev-dependencies]
wasm-bindgen-test = "0.3.42"
