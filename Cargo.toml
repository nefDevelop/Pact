[workspace]
resolver = "2"

members = [
    "crates/pact-core",
    "crates/pact-server",
    "crates/pact-desktop",
]

[workspace.package]
version = "0.2.0"
authors = ["Pact Team"]
edition = "2021"
license = "MIT"

# Perfil de desarrollo optimizado para criptografía
[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
# Crypto
argon2 = "0.5.3"
aes-gcm = "0.10.3"
blake2 = "0.10.6"
getrandom = { version = "0.2.15", features = ["js"] }
rand = "0.8.5"
zeroize = { version = "1.8", features = ["derive"] }

# Backend
axum = { version = "0.7.5", features = ["multipart"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"
tower-http = { version = "0.5.2", features = ["cors", "fs", "trace", "limit"] }
sqlx = { version = "0.7.4", features = ["runtime-tokio", "tls-rustls", "sqlite", "mysql", "chrono", "uuid", "default"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["serde", "v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
totp-rs = { version = "5.5", features = ["gen_secret", "otpauth"] }
base64 = "0.22"

# WASM
wasm-bindgen = "0.2.92"
async-trait = "0.1"
dashmap = "5.5"
zip = "1.1"
tempfile = "3.10"
thiserror = "1.0.61"
anyhow = "1.0.86"
